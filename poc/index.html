<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Superset Mobile Embed POC</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #dashboard {
        position: fixed;
        inset: 0;
        height: 100dvh;
      }
      #dashboard iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="dashboard"></div>
    <script src="https://cdn.jsdelivr.net/npm/@superset-ui/embedded-sdk@0.4.0/bundle/index.js"></script>
    <script>
      supersetEmbeddedSdk.embedDashboard({
        id: 'dc505710-4710-4b63-ab62-f768b0f4ace9',
        supersetDomain: 'http://192.168.18.14:9000',
        mountPoint: document.getElementById('dashboard'),
        fetchGuestToken: () =>
          fetch('/token')
            .then(r => {
              if (!r.ok) throw new Error('token request failed: ' + r.status);
              return r.json();
            })
            .then(d => d.token),
        dashboardUiConfig: {
          filters: { expanded: window.innerWidth > 820 },
        },
      });
    </script>
  </body>
</html>
